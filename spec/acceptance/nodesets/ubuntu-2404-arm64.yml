HOSTS:
  ubuntu2404-arm64:
    roles:
      - agent
    platform: ubuntu-24.04-arm64
    hypervisor: docker
    image: arm64v8/ubuntu:24.04
    docker_cmd: '["/sbin/init"]'
    docker_image_commands:
      - 'apt-get install -y iproute2'
CONFIG:
  type: foss
  log_level: verbose
  dockeropts:
    HostConfig:
      Privileged: true